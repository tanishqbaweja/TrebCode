name: Publish previously checked desktop packages

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed Desktop release run with all four platform checks successful
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml
  publish:
    needs: security
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify the original platform checks
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TREBELL_CHECKED_RUN: ${{ inputs.build_run }}
        run: node scripts/verify-desktop-build.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish packages from the verified source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ steps.checked.outputs.commit }}
        run: node scripts/publish-desktop-release.mjs
