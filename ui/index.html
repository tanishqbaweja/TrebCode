<!doctype html>
<html lang="en" data-mode="light" style="color-scheme:light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f6" />
    <link rel="icon" type="image/svg+xml" href="/trebell-code-icon.svg" />
    <title>Trebell Code</title>
    <script>
      /* Fresh profiles start light. Apply this browser's saved choice before stylesheets load. */
      (function(){try{var cached=JSON.parse(localStorage.getItem("trebell-appearance-v1")||"null");if(!cached||typeof cached!=="object")return;
        var root=document.documentElement,requested=cached.mode==="system"||cached.mode==="dark"?cached.mode:"light";
        var dark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)").matches:false;
        var mode=requested==="system"?(dark===false?"light":"dark"):requested;
        root.dataset.mode=mode;root.style.colorScheme=mode;
        if(cached.theme==="dark"||cached.theme==="midnight"||cached.theme==="black")root.dataset.theme=cached.theme;
      }catch(error){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
